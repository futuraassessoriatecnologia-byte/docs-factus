site_name: Factus ERP — Documentação
site_description: Documentação técnica e funcional do sistema Factus ERP
site_author: Equipe Factus
site_url: https://futuraassessoriatecnologia-byte.github.io/docs-factus

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: pt
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Financeiro:
      - Conciliação Bancária:
          - Regras de Conciliação: financeiro/conciliacao-bancaria/regras-conciliacao.md
  - Estoque:
      - Inventário de Estoque: estoque/inventario/inventario.md
      - Controle de Lote e Validade:
          - Visão Geral: estoque/controle-lote/index.md
          - Habilitando o Controle de Lote: estoque/controle-lote/habilitando.md
          - Tela Lotes de Produto: estoque/controle-lote/lotes-de-produto.md
          - Relatórios de Lote: estoque/controle-lote/relatorios.md
          - Entrada por NF de Compra: estoque/controle-lote/nf-compra.md
          - Saída por NF de Venda: estoque/controle-lote/nf-venda.md
          - Ordem de Produção: estoque/controle-lote/ordem-producao.md
          - Rastreabilidade no XML: estoque/controle-lote/xml-nfe-rastro.md
  - Nota Fiscal:
      - NF-e:
          - Encerrar Nota Fiscal (Saída): nota-fiscal/nfe/encerramento-nota-fiscal.md
  - Compras:
      - Ordem de Compra: compras/ordem-de-compra.md
